<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Шахта до діаманта</title>
<style>
:root{
  --bg:#120f1c; --panel:#211c33; --panel2:#2d2645; --line:#0a0810;
  --text:#ffffff; --muted:#d6cff0; --gold:#ffd23f; --ok:#6af08a; --bad:#ffc0a0;
  --event:#1f7ae0; --event-d:#0e4f9e; --loop:#22a447; --loop-d:#12702c;
  --walk:#e0479a; --walk-d:#9c2766; --run:#f59e0b; --run-d:#a8650a; --magic:#8e44ad;
  --head:"Courier New", Courier, monospace;
  --body:"Trebuchet MS","Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#07060b;overflow:hidden;font-family:var(--body);color:var(--text)}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:var(--bg);overflow:hidden;user-select:none}
button{font-family:var(--body);cursor:pointer}
.hidden{display:none!important}
.px{font-family:var(--head);font-weight:900;letter-spacing:1px;text-shadow:3px 3px 0 #000}
.en{font-family:var(--head);font-weight:900;color:#7ff6ff}
.gold{color:var(--gold)}
.walkc{color:#ff8cc6}
.runc{color:#ffc04d}

/* ---------- Верхня панель ---------- */
#topbar{position:absolute;left:0;top:0;width:1920px;height:90px;display:flex;align-items:center;gap:20px;padding:0 20px;background:#1a1528;border-bottom:6px solid var(--line);box-shadow:inset 0 -4px 0 #2e2648;z-index:50}
#tbLevel{width:640px;font-size:26px;font-weight:bold;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tbTitle{flex:1;text-align:center;font-size:40px;white-space:nowrap}
#tbProgWrap{display:flex;align-items:center;gap:14px}
#tbProg{font-size:30px;font-weight:bold;white-space:nowrap}
#tbSquares{display:flex;gap:6px}
.sq{width:34px;height:34px;border:3px solid #000;position:relative;background-size:cover;image-rendering:pixelated}
.sq.broken::after{content:'✓';position:absolute;inset:0;display:grid;place-items:center;color:var(--ok);font-weight:900;font-size:24px;background:rgba(0,0,0,.7)}
.sq.cur{outline:4px solid var(--gold);outline-offset:2px}
.icon-btn{width:62px;height:62px;font-size:30px;border:4px solid #000;background:#3a3156;color:#fff;box-shadow:inset -4px -4px 0 rgba(0,0,0,.35),inset 4px 4px 0 rgba(255,255,255,.15);padding:0}
.icon-btn:hover{filter:brightness(1.2)}

/* ---------- Шахта ---------- */
#minePanel{position:absolute;left:0;top:90px;width:672px;height:990px;background:#000}
#mineCanvas{display:block;width:672px;height:990px;image-rendering:pixelated}

/* ---------- Поле раунду ---------- */
#roundPanel{position:absolute;left:672px;top:90px;width:1248px;height:990px;background:var(--panel);border-left:6px solid var(--line)}
#screens{position:absolute;left:0;top:0;right:0;bottom:112px}
.screen{position:absolute;inset:18px 26px;display:none;flex-direction:column;gap:12px}
.screen.active{display:flex}
#controls{position:absolute;left:0;right:0;bottom:0;height:112px;display:flex;align-items:center;gap:7px;padding:0 10px;background:#17131f;border-top:6px solid var(--line)}
#controls .spacer{flex:1}
#controls .btn{font-size:23px;padding:12px 9px}

/* ---------- Кнопки ---------- */
.btn{--c:#4a3f6b;font-size:26px;font-weight:bold;color:#fff;background:var(--c);border:4px solid #000;padding:12px 20px;box-shadow:inset -4px -5px 0 rgba(0,0,0,.3),inset 4px 4px 0 rgba(255,255,255,.22),0 6px 0 #000;transition:transform .06s,filter .1s;white-space:nowrap;line-height:1.1;text-shadow:2px 2px 0 rgba(0,0,0,.45)}
.btn:hover{filter:brightness(1.12)}
.btn:active{transform:translateY(4px);box-shadow:inset -4px -5px 0 rgba(0,0,0,.3),inset 4px 4px 0 rgba(255,255,255,.22),0 2px 0 #000}
.btn:disabled{filter:grayscale(.85) brightness(.65);cursor:not-allowed;transform:none}
.btn.big{font-size:32px;padding:14px 26px}
.btn.gold{--c:#e8a800;color:#1a1200;text-shadow:none}
.btn.green{--c:#22a447}
.btn.blue{--c:#1f7ae0}
.btn.purple{--c:#7b4fd6}
.btn.teal{--c:#0e8f9b}
.btn.red{--c:#c94a4a}
.btn.walkb{--c:var(--walk)}
.btn.runb2{--c:#d98a00}
.btn.locked{opacity:.5}
.pulse-btn{animation:pulseBtn 1s ease-in-out infinite}
@keyframes pulseBtn{50%{transform:scale(1.06);filter:brightness(1.2)}}
.say{width:46px;height:46px;font-size:22px;border:3px solid #000;background:#fff;border-radius:8px;cursor:pointer;line-height:1;padding:0;flex:none;box-shadow:0 3px 0 #000}
.say:active{transform:translateY(2px);box-shadow:0 1px 0 #000}
body.no-tts .say{display:none!important}

/* ---------- Загальні елементи раунду ---------- */
.rhead{display:flex;align-items:center;gap:16px;min-height:56px}
.rbadge{font-family:var(--head);font-weight:900;font-size:26px;background:var(--gold);color:#000;padding:6px 14px;border:4px solid #000}
.rtitle{font-size:38px}
.rlayer{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:24px;font-weight:bold;background:#0009;padding:6px 14px;border:3px solid #000}
.rlayer i{display:inline-block;width:32px;height:32px;border:3px solid #000;background-size:cover;image-rendering:pixelated}
.rule{display:flex;align-items:center;gap:18px;font-size:28px;font-weight:bold;background:var(--panel2);border:4px solid #000;padding:6px 18px;min-height:56px}
.chip{display:flex;align-items:center;gap:6px;padding:2px 12px;border:3px solid #000;border-radius:8px}
.chip.walk{background:#6d1f4a}
.chip.run{background:#6b4300}
i.fl{display:inline-block;width:28px;height:36px;vertical-align:middle}
i.fl svg{display:block;filter:drop-shadow(1px 0 0 #000) drop-shadow(-1px 0 0 #000) drop-shadow(0 1px 0 #000) drop-shadow(0 -1px 0 #000)}
.fls{display:inline-flex;gap:2px}
.msgbar{margin-top:auto;display:flex;align-items:center;gap:18px;min-height:86px;background:var(--panel2);border:4px solid #000;padding:8px 18px;flex:none}
.msg{flex:1;font-size:28px;font-weight:bold;line-height:1.25}
.msg.ok{color:var(--ok)}
.msg.bad{color:var(--bad)}
.act{display:flex;gap:12px;align-items:center}
.done-label{font-size:26px;font-weight:bold;color:var(--ok)}
.bump{animation:bumpA .25s}
@keyframes bumpA{50%{transform:scale(1.25)}}
.shake{animation:shakeA .45s}
@keyframes shakeA{20%,60%{transform:translateX(-12px)}40%,80%{transform:translateX(12px)}}
@keyframes grow{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes floatY{50%{transform:translateY(-12px)}}

/* ---------- Лічильник (степер) ---------- */
.stepper{display:flex;align-items:center;gap:10px}
.stepper .sb{width:70px;height:70px;font-size:40px;padding:0}
.stepper .val{min-width:120px;height:78px;display:grid;place-items:center;background:#000;border:4px solid #555;font-family:var(--head);font-weight:900;font-size:56px;color:var(--gold)}

/* ---------- Доріжка з квітами ---------- */
.trail{position:relative;flex:none;border:4px solid #000;overflow:hidden;background:linear-gradient(#8fd3ff 0%,#d4f1ff 70%)}
.trail-ground{position:absolute;left:0;right:0;bottom:0;height:46px;background-image:var(--grass);background-size:46px 46px;image-rendering:pixelated;border-top:4px solid #2a6b1a}
.walker{position:absolute;bottom:40px;left:10px;width:60px;height:85px;image-rendering:pixelated;z-index:3}
.walker.walking{animation:bob .42s steps(2) infinite}
.walker.running{animation:bob .2s steps(2) infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.walker.tired{animation:tired .6s ease-in-out infinite;filter:saturate(.35) brightness(.9)}
@keyframes tired{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(5px) rotate(7deg)}}
.flower{position:absolute;bottom:38px;z-index:2;transform-origin:50% 100%;animation:grow .35s cubic-bezier(.2,1.6,.4,1) both}
.flower svg{display:block;width:100%;height:100%;filter:drop-shadow(2px 0 0 #000) drop-shadow(-2px 0 0 #000) drop-shadow(0 2px 0 #000) drop-shadow(0 -2px 0 #000)}
.trail-count{position:absolute;right:12px;top:8px;display:flex;align-items:center;gap:8px;background:#000c;border:4px solid #000;padding:2px 16px;z-index:5;font-family:var(--head);font-weight:900;font-size:50px;color:#fff}
.trail-count .ic{width:36px;height:46px;display:block}
.trail-count .ic svg{width:100%;height:100%}
.bubble{position:absolute;bottom:132px;z-index:6;background:#fff;color:#000;font-size:26px;font-weight:bold;padding:6px 14px;border:4px solid #000;white-space:nowrap;animation:pop .2s}

/* ---------- Блоки у стилі MakeCode ---------- */
.mc-c{--c:var(--loop);--cd:var(--loop-d);position:relative;background:var(--c);border:3px solid var(--cd);border-radius:12px;width:max-content;color:#fff;font-weight:bold;transition:box-shadow .2s}
.mc-c.ev{--c:var(--event);--cd:var(--event-d);border-radius:46px 46px 12px 12px/30px 30px 12px 12px}
.mc-c:not(.ev)::before{content:'';position:absolute;top:-3px;left:22px;width:30px;height:9px;background:var(--panel);border-radius:0 0 7px 7px}
.mc-c::after{content:'';position:absolute;bottom:-11px;left:22px;width:30px;height:9px;background:var(--c);border:3px solid var(--cd);border-top:none;border-radius:0 0 8px 8px;z-index:1}
.mc-head{display:flex;align-items:center;gap:12px;padding:9px 22px 8px;font-size:30px;text-shadow:2px 2px 0 rgba(0,0,0,.3)}
.mc-c.ev .mc-head{padding:20px 26px 10px;font-size:34px;font-family:var(--head)}
.mc-c.ev.solo .mc-head{padding:18px 26px 14px}
.mc-num{background:#fff;color:#222;border-radius:22px;padding:0 16px;font-size:28px;border:2px solid var(--cd);text-shadow:none}
.mc-str{background:#fff;color:#b3261e;border-radius:8px;padding:0 10px;font-family:var(--head);text-shadow:none}
.mc-body{margin-left:28px;margin-right:-3px;background:var(--panel);border:3px solid var(--cd);border-right:none;border-radius:10px 0 0 10px;padding:8px 40px 8px 0;min-height:64px;display:flex;align-items:center}
.mc-foot{height:20px}
.mc-stmt{position:relative;display:inline-flex;align-items:center;gap:10px;padding:8px 18px;border-radius:8px;font-size:28px;font-weight:bold;color:#fff;border:3px solid rgba(0,0,0,.35);text-shadow:2px 2px 0 rgba(0,0,0,.3)}
.mc-stmt::before{content:'';position:absolute;top:-3px;left:18px;width:28px;height:9px;background:var(--panel);border-radius:0 0 7px 7px}
.mc-stmt.walk{background:var(--walk)}
.mc-stmt.run{background:var(--run)}
.mc-stmt.magic{background:var(--magic)}
.running{box-shadow:0 0 0 5px var(--gold),0 0 34px 8px rgba(255,210,63,.75)!important;z-index:5}
.iter{background:var(--gold);color:#000;border-radius:8px;padding:0 12px;font-size:26px;border:3px solid #000;text-shadow:none}
.iter:empty{display:none}
.flash{animation:flashS .3s}
@keyframes flashS{50%{transform:scale(1.08);filter:brightness(1.4)}}
.code-stack{display:flex;flex-direction:column}
.code-stack>.mc-c:first-child{z-index:2}

/* ---------- Раунд 1 ---------- */
.r1-top{display:flex;gap:28px;align-items:center}
.r1-top .code-stack{width:560px}
.predict{flex:1;display:flex;flex-direction:column;align-items:center;gap:12px;background:var(--panel2);border:4px solid #000;padding:14px}
.q2{font-size:34px;font-weight:bold;text-align:center}
.lbl{font-size:26px;color:var(--muted);font-weight:bold}
.summary{min-height:58px;display:flex;align-items:center;justify-content:center;gap:12px;font-size:32px;font-weight:bold;background:#000;border:4px solid #000;padding:4px 14px;flex:none}
.summary span{animation:pop .3s both}
.summary:empty{visibility:hidden}

/* ---------- Раунд 2 ---------- */
.r2-main{display:flex;gap:24px;height:330px;flex:none}
.r2-left{flex:1;display:flex;flex-direction:column;gap:16px;justify-content:center}
.q3{font-size:34px;font-weight:bold}
.srow{display:flex;align-items:center;gap:20px}
.slbl{width:330px;font-size:30px;font-weight:bold}
.found{width:470px;background:var(--panel2);border:4px solid #000;padding:10px 14px;display:flex;flex-direction:column;gap:6px}
.fhead{font-size:28px;font-weight:bold;display:flex;justify-content:space-between;align-items:center}
.pips{display:flex;gap:4px;font-size:26px}
.pips span{filter:grayscale(1) brightness(.5)}
.pips span.on{filter:none}
.frow{font-size:26px;font-weight:bold;background:#0007;padding:3px 10px;border:3px solid #000;display:flex;gap:14px;animation:pop .3s}
.frow .eq{margin-left:auto;color:#fff}
.frow.flashrow{animation:flashS .3s 3}

/* ---------- Раунд 3 ---------- */
.task{font-size:28px;font-weight:bold;background:var(--panel2);border:4px solid #000;padding:10px 16px;line-height:1.25;min-height:80px;display:flex;align-items:center}
.task.ruleB{background:#5a2a12;border-color:#ff9a3c;box-shadow:0 0 0 3px #000;animation:pop .3s}
.cards{display:flex;gap:6px;min-height:106px;align-items:center;background:#0005;border:4px dashed #6b5f8f;padding:6px 10px;flex:none}
.cards-empty{font-size:28px;color:var(--muted);font-weight:bold;padding-left:10px}
.pcard{width:74px;height:88px;border:4px solid #000;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:32px;animation:grow .2s;flex:none;box-shadow:inset -3px -4px 0 rgba(0,0,0,.25)}
.pcard.w{background:var(--walk)}
.pcard.r{background:var(--run)}
.pcard .pf{display:flex;gap:1px;height:30px}
.pcard .pf i.fl{width:22px;height:30px}
.pcard.active{outline:5px solid #fff;transform:translateY(-6px)}
.pcard.done{opacity:.7}
.pcard.bad{outline:6px solid #ff3b3b;opacity:1;animation:shakeA .45s}
.r3-btns{display:flex;gap:14px;align-items:center}
.r3-btns .gob{margin-left:auto}
.stats{display:flex;gap:16px;font-size:28px;font-weight:bold}
.stats span{background:#0007;border:3px solid #000;padding:5px 14px}

/* ---------- Раунд 4 ---------- */
.r4-inst{font-size:28px;font-weight:bold}
.r4-area{position:relative;flex:1}
.links{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:3}
.ores{position:absolute;left:0;top:0;width:400px;display:flex;flex-direction:column;gap:12px}
.means{position:absolute;left:590px;top:0;width:600px;display:flex;flex-direction:column;gap:12px}
.ore{position:relative;height:108px;border:5px solid #000;background-size:60px 60px;image-rendering:pixelated;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;box-shadow:inset -6px -6px 0 rgba(0,0,0,.4),inset 6px 6px 0 rgba(255,255,255,.2);transition:transform .1s}
.ore .w{font-size:42px;font-weight:900;font-family:var(--head);color:#fff;text-shadow:3px 3px 0 #000,-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000}
.ore .tr{font-size:26px;font-weight:bold;color:var(--gold);text-shadow:2px 2px 0 #000,-1px -1px 0 #000}
.ore .say{position:absolute;right:6px;top:6px}
.ore:hover{transform:scale(1.02)}
.ore.sel{outline:7px solid var(--gold);outline-offset:3px;transform:scale(1.03)}
.mean{height:108px;background-size:120px 60px;image-rendering:pixelated;border:5px solid #000;color:#2a1608;font-size:24px;font-weight:bold;display:flex;align-items:center;padding:6px 18px;cursor:pointer;line-height:1.2;box-shadow:inset -5px -5px 0 rgba(0,0,0,.2),inset 5px 5px 0 rgba(255,255,255,.3);transition:transform .1s}
.mean b{font-size:28px;color:#000}
.mean:hover{transform:scale(1.01)}
.ore.matched,.mean.matched{box-shadow:0 0 0 5px var(--ok),0 0 30px 8px rgba(106,240,138,.75);cursor:default;transform:none}

/* ---------- Раунд 5 ---------- */
.sit{background:var(--panel2);border:4px solid #000;padding:10px 20px;flex:none}
.sit-n{font-size:24px;color:var(--muted);display:flex;gap:14px;align-items:center;font-weight:bold}
.dots{display:flex;gap:6px}
.dots i{width:22px;height:22px;display:inline-block;border:3px solid #000;background:#555}
.dots i.ok{background:var(--ok)}
.dots i.cur{outline:3px solid var(--gold);outline-offset:1px}
.sit-t{font-size:38px;font-weight:bold;line-height:1.2;animation:pop .3s}
.choices{display:flex;gap:40px;justify-content:center;flex:none}
.ch{display:flex;flex-direction:column;align-items:center;gap:8px}
.choice{background:none;border:none;padding:6px;transition:transform .1s;color:inherit}
.choice:hover:not(:disabled){transform:scale(1.04)}
.choice:disabled{cursor:default}
.choice.chosen .mc-c{box-shadow:0 0 0 5px var(--gold),0 0 30px 8px rgba(255,210,63,.7)}
.ua{font-size:26px;font-weight:bold;color:var(--gold);display:flex;align-items:center;gap:8px}
.world{position:relative;height:250px;border:4px solid #000;overflow:hidden;flex:none;background:#0b0d1a}
.wsky{position:absolute;inset:0;background:linear-gradient(#6fc3ff,#c4eaff);opacity:0;transition:opacity .7s}
.world.on .wsky{opacity:1}
.wground{position:absolute;left:0;right:0;bottom:0;height:56px;background-image:var(--grass);background-size:56px 56px;image-rendering:pixelated;filter:brightness(.35);transition:filter .7s}
.world.on .wground{filter:none}
.wminer{position:absolute;left:150px;bottom:52px;width:54px;height:76px;image-rendering:pixelated;filter:brightness(.35);transition:filter .7s}
.world.on .wminer{filter:none}
.wfx{position:absolute;inset:0;pointer-events:none}
.wstatus{position:absolute;left:12px;top:10px;font-size:26px;font-weight:bold;background:#000b;border:3px solid #000;padding:4px 12px;z-index:4}
.wchat{position:absolute;left:12px;bottom:8px;font-size:26px;font-family:var(--head);font-weight:900;background:#000c;border:3px solid #000;padding:2px 14px;z-index:4;min-width:260px}
.wchat .caret{animation:blink 1s steps(1) infinite}
.wchat.sent{box-shadow:0 0 0 4px var(--gold)}
@keyframes blink{50%{opacity:0}}
.e-fire{position:absolute;bottom:46px;font-size:80px;animation:flick .25s ease-in-out infinite alternate,grow .3s both}
@keyframes flick{to{transform:scale(1.12) translateY(-6px)}}
.e-spark{position:absolute;font-size:44px;animation:twinkle .8s ease-in-out infinite alternate}
@keyframes twinkle{from{transform:scale(.5) rotate(0);opacity:.4}to{transform:scale(1.2) rotate(30deg);opacity:1}}
.e-ring{position:absolute;left:112px;bottom:40px;width:130px;height:130px;border-radius:50%;box-shadow:0 0 50px 24px rgba(200,120,255,.8);animation:pop .4s}
.e-cloud{position:absolute;top:24px;font-size:84px}
.e-drop{position:absolute;top:-20px;width:5px;height:22px;background:#3a7bff;animation:fallD .6s linear infinite}
@keyframes fallD{to{transform:translateY(270px)}}
.e-greet{position:absolute;left:50%;top:70px;transform:translateX(-50%);font-size:44px;font-weight:bold;background:#fff;color:#1a1200;border:5px solid #000;padding:10px 26px;white-space:nowrap;animation:pop .35s;box-shadow:0 6px 0 #000}
.e-none{position:absolute;left:50%;top:90px;transform:translateX(-50%);font-size:70px;animation:pop .3s}

/* ---------- Раунд 6 ---------- */
.fills{display:flex;flex-direction:column;gap:14px}
.fill-row{display:flex;flex-direction:column;gap:12px;background:var(--panel2);border:4px solid #000;padding:12px 16px}
.fill-top{display:flex;align-items:center;gap:18px;min-height:80px}
.fnum{font-family:var(--head);font-weight:900;font-size:30px;background:var(--gold);color:#000;border:3px solid #000;width:48px;height:48px;display:grid;place-items:center;flex:none}
.fsent{font-size:32px;font-weight:bold;display:flex;align-items:center;gap:14px}
.fdone{margin-left:auto;font-size:26px;color:var(--ok);font-weight:bold;text-align:right}
.slot{display:inline-block;min-width:150px;border:4px dashed #fff;border-radius:10px;padding:0 12px;text-align:center;color:#fff;background:rgba(0,0,0,.25);font-family:var(--head);font-weight:900}
.slot.filled{border-style:solid;background:#fff;color:var(--event-d);animation:grow .4s;text-shadow:none}
.mc-run{display:inline-flex;align-items:center;gap:10px;background:#22a447;border:4px solid #0b5a22;border-radius:14px;padding:6px 18px;font-size:32px;font-weight:bold;color:#fff;box-shadow:0 5px 0 #0b5a22}
.alive{animation:alive 1.2s ease-in-out infinite}
@keyframes alive{50%{box-shadow:0 0 0 5px #fff,0 0 40px 14px rgba(120,230,255,.95)}}
.opts{display:flex;gap:22px;padding-left:66px}
.opt{display:flex;align-items:center;gap:6px}
.opt-b{display:flex;flex-direction:column;align-items:center;font-family:var(--head);font-size:32px;min-width:200px;padding:6px 16px}
.opt-b small{font-family:var(--body);font-size:22px;color:#ffe9a8;font-weight:bold}
.opt-b.right{--c:#22a447;filter:none!important;box-shadow:0 0 0 5px var(--ok),0 6px 0 #000}

/* ---------- Старт / фінал ---------- */
.intro{align-items:center;justify-content:center;gap:22px;text-align:center}
.intro-title{font-size:66px;color:var(--gold)}
.intro-book{display:flex;gap:26px;align-items:center;background:var(--panel2);border:4px solid #000;padding:18px 30px;text-align:left;max-width:1120px}
.book{font-size:110px;animation:floatY 2.4s ease-in-out infinite}
.story p{margin:6px 0;font-size:32px;line-height:1.3}
.cy{color:#7ff6ff}
.levels{display:flex;gap:20px}
.lvl{font-size:26px;font-weight:bold;background:#0007;border:4px solid #000;padding:12px 18px;text-align:left;line-height:1.3}
.teacher-hint{font-size:22px;color:var(--muted);max-width:1100px}
.final{gap:16px;justify-content:center}
.fin-top{display:flex;align-items:center;gap:40px;justify-content:center}
.fin-gem{position:relative;width:200px;height:180px;display:grid;place-items:center;flex:none}
.fin-gem::before{content:'';position:absolute;inset:-50px;background:repeating-conic-gradient(rgba(130,255,255,.5) 0 10deg,transparent 10deg 30deg);border-radius:50%;animation:spin 8s linear infinite;-webkit-mask:radial-gradient(circle,#000 25%,transparent 70%);mask:radial-gradient(circle,#000 25%,transparent 70%)}
.fin-gem img{position:relative;width:170px;image-rendering:pixelated;animation:floatY 2s ease-in-out infinite;filter:drop-shadow(0 0 22px #7ff)}
.fin-t{font-size:62px;color:var(--gold)}
.fin-t2{font-size:40px;font-weight:bold;margin-top:6px}
.fin-h{font-size:34px;font-weight:bold;color:var(--gold);text-align:center}
.fin-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.fin-list li{font-size:28px;font-weight:bold;background:var(--panel2);border:4px solid #000;padding:10px 18px;display:flex;gap:14px;align-items:center;animation:pop .5s both;line-height:1.3}
.fin-list li .ic{font-size:40px}
.fin-list li:nth-child(2){animation-delay:.25s}
.fin-list li:nth-child(3){animation-delay:.5s}
.fin-list li:nth-child(4){animation-delay:.75s}
.fin-btns{display:flex;justify-content:center}

/* ---------- Перехід між рівнями ---------- */
#trans{position:absolute;left:0;top:90px;width:1920px;height:990px;display:none;z-index:40;overflow:hidden;background:linear-gradient(#5fb8ff,#cdeeff 75%)}
#trans.active{display:block}
.tr-ground{position:absolute;left:0;right:0;bottom:0;height:200px;background-image:var(--grass);background-size:100px 100px;image-rendering:pixelated;border-top:6px solid #2a6b1a}
.tr-runner{position:absolute;bottom:194px;width:120px;height:170px;animation:runAcross 4.5s linear infinite;z-index:3}
.tr-runner img{width:100%;height:100%;image-rendering:pixelated;animation:bob .22s steps(2) infinite}
@keyframes runAcross{from{left:-160px}to{left:2000px}}
.tr-text{position:absolute;top:70px;left:0;right:0;text-align:center;display:flex;flex-direction:column;align-items:center;gap:22px;z-index:4}
.tr-big{font-size:88px;color:#fff;display:flex;align-items:center;gap:24px;text-shadow:5px 5px 0 #000}
.runw{color:var(--gold)}
.tr-mid{font-size:46px;font-weight:bold;color:#10213a;background:#fffd;border:5px solid #000;padding:14px 30px;box-shadow:0 8px 0 #000}
.tr-pair{display:flex;gap:30px}
.tr-pair>span{font-size:40px;font-weight:bold;background:#000c;border:4px solid #000;padding:10px 24px}
.tr-flowers .flower{bottom:196px}
.tr-nav{position:absolute;right:30px;bottom:40px;display:flex;gap:16px;z-index:5}
.cloud{position:absolute;width:200px;height:50px;background:#fff;z-index:1;animation:drift 50s linear infinite}
.cloud::before{content:'';position:absolute;left:40px;top:-30px;width:90px;height:30px;background:#fff}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-2400px)}}

/* ---------- Модальне вікно, тост, частинки ---------- */
#modal{position:absolute;inset:0;background:rgba(5,3,10,.8);display:none;align-items:center;justify-content:center;z-index:90}
#modal.open{display:flex}
.mcard{width:1500px;max-height:960px;overflow:auto;background:var(--panel2);border:6px solid #000;box-shadow:inset -6px -6px 0 rgba(0,0,0,.3),inset 6px 6px 0 rgba(255,255,255,.12),0 0 0 6px var(--gold);padding:34px 48px;display:flex;flex-direction:column;gap:24px;animation:pop .25s}
.mkick{font-family:var(--head);font-weight:900;font-size:34px;color:var(--gold);text-shadow:3px 3px 0 #000}
.mtext{font-size:58px;font-weight:bold;line-height:1.25}
.mtext.ans{color:var(--ok)}
.mtext.small{font-size:42px}
.mtext small{font-size:36px;color:var(--muted)}
.mans{font-size:48px;font-weight:bold;color:var(--ok);line-height:1.3;background:#0007;border:4px solid #000;padding:18px 26px;animation:pop .3s}
.mans small{font-size:34px;color:var(--muted)}
.mrow{display:flex;gap:16px;justify-content:flex-end;align-items:center}
#toast{position:absolute;left:1296px;top:110px;transform:translateX(-50%) translateY(-20px);background:#000e;border:4px solid var(--gold);font-size:30px;font-weight:bold;padding:12px 26px;z-index:85;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#fx{position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none;z-index:70}
</style>
</head>
<body>
<div id="stage">
  <header id="topbar">
    <div id="tbLevel"></div>
    <div id="tbTitle" class="px">⛏ Шахта до діаманта 💎</div>
    <div id="tbProgWrap"><span id="tbProg"></span><div id="tbSquares"></div></div>
    <button class="icon-btn" id="bSound" title="Звук: увімкнути / вимкнути">🔊</button>
    <button class="icon-btn" id="bFull" title="На весь екран">⛶</button>
  </header>

  <aside id="minePanel"><canvas id="mineCanvas" width="672" height="990"></canvas></aside>

  <main id="roundPanel">
    <div id="screens"></div>
    <nav id="controls">
      <button class="btn blue" id="bAsk">🤔 Як думаєте?</button>
      <button class="btn teal" id="bAns">👀 Показати відповідь</button>
      <button class="btn purple" id="bFast">⚡ Для швидких</button>
      <div class="spacer"></div>
      <button class="btn" id="bReset" title="Клавіша R">↺ Скинути раунд</button>
      <button class="btn" id="bPrev" title="Клавіша ←">← Назад</button>
      <button class="btn gold" id="bNext" title="Клавіша →">Далі →</button>
    </nav>
  </main>

  <div id="trans">
    <div class="cloud" style="left:300px;top:60px"></div>
    <div class="cloud" style="left:1200px;top:140px;animation-duration:70s"></div>
    <div class="cloud" style="left:2000px;top:40px;animation-duration:60s"></div>
    <div class="tr-text">
      <div class="tr-big px">Бігти англійською — <span class="runw">RUN!</span> <button class="say" data-say="run" title="Послухати">🔊</button></div>
      <div class="tr-mid">А ще <span class="en" style="color:#0b5aa8">run</span> означає «запустити код». Перевіримо англійську!</div>
      <div class="tr-pair"><span>🏃 <span class="en">run</span> = бігти</span><span>▶ <span class="en">run</span> = запустити</span></div>
    </div>
    <div class="tr-flowers"></div>
    <div class="tr-runner"><img alt="" id="trImg"></div>
    <div class="tr-ground"></div>
    <div class="tr-nav"><button class="btn big" id="tPrev">← Назад</button><button class="btn gold big pulse-btn" id="tNext">Далі →</button></div>
  </div>

  <div id="toast"></div>
  <canvas id="fx" width="1920" height="1080"></canvas>
  <div id="modal"><div class="mcard"></div></div>
</div>

<script>
'use strict';
/* =========================================================
   ДОПОМІЖНЕ
   ========================================================= */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const h = html => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };
const cnv = (w, hh) => { const c = document.createElement('canvas'); c.width = w; c.height = hh; return c; };
const CANCEL = Symbol('cancel');
const swallow = e => { if (e !== CANCEL) throw e; };
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function pickW(cols, R) { const r = R(); return cols[r < .45 ? 0 : r < .7 ? 1 : r < .9 ? 2 : 3] || cols[0]; }
function plural(n, one, few, many) { const a = n % 10, b = n % 100; if (a === 1 && b !== 11) return one; if (a >= 2 && a <= 4 && (b < 12 || b > 14)) return few; return many; }
const kroky = n => plural(n, 'крок', 'кроки', 'кроків');
const kvGen = n => plural(n, 'квітки', 'квіток', 'квіток');   // не вистачає 2 квіток
const kvAcc = n => plural(n, 'квітку', 'квітки', 'квіток');   // на 2 квітки більше
const razy = n => plural(n, 'раз', 'рази', 'разів');
function bump(el) { el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
function shake(el) { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }
function flash(el) { el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }

const stage = $('#stage');
const sc = () => stage.getBoundingClientRect().width / 1920;
function fit() {
  const s = Math.min(innerWidth / 1920, innerHeight / 1080);
  stage.style.transform = `translate(${(innerWidth - 1920 * s) / 2}px,${(innerHeight - 1080 * s) / 2}px) scale(${s})`;
}
addEventListener('resize', fit); fit();

let toastT;
function toast(t) { const el = $('#toast'); el.innerHTML = t; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 2200); }

/* =========================================================
   ЗВУК (Web Audio API)
   ========================================================= */
const Sound = (() => {
  let ac = null, master = null, muted = false;
  function ctx() {
    if (muted) return null;
    if (!ac) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; ac = new C(); master = ac.createGain(); master.gain.value = .5; master.connect(ac.destination); }
    if (ac.state === 'suspended') ac.resume();
    return ac;
  }
  function tone(f, d, { type = 'square', v = .12, at = 0, to = null } = {}) {
    const a = ctx(); if (!a) return;
    const t = a.currentTime + at, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (to) o.frequency.exponentialRampToValueAtTime(to, t + d);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g).connect(master); o.start(t); o.stop(t + d + .03);
  }
  function noise(d, { v = .3, at = 0, f = 1200, q = .8, type = 'lowpass' } = {}) {
    const a = ctx(); if (!a) return;
    const t = a.currentTime + at, len = Math.floor(a.sampleRate * d), b = a.createBuffer(1, len, a.sampleRate), data = b.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const s = a.createBufferSource(); s.buffer = b;
    const fl = a.createBiquadFilter(); fl.type = type; fl.frequency.value = f; fl.Q.value = q;
    const g = a.createGain(); g.gain.value = v;
    s.connect(fl).connect(g).connect(master); s.start(t);
  }
  return {
    get muted() { return muted; },
    toggle() { muted = !muted; if (ac) muted ? ac.suspend() : ac.resume(); return muted; },
    click() { tone(660, .05, { v: .07 }); },
    pop(i = 0) { const k = Math.min(i, 20); tone(500 + k * 35, .09, { type: 'triangle', v: .16, to: 880 + k * 35 }); },
    step() { noise(.05, { v: .12, f: 600 }); },
    good() { [523, 659, 784, 1047].forEach((f, i) => tone(f, .16, { v: .09, at: i * .08 })); },
    soft() { tone(330, .18, { type: 'triangle', v: .14, to: 262 }); tone(262, .24, { type: 'triangle', v: .12, at: .15, to: 220 }); },
    crack() { noise(.12, { v: .35, f: 2500, type: 'highpass' }); tone(180, .08, { v: .1, to: 90 }); },
    hit() { noise(.08, { v: .3, f: 900 }); tone(140, .1, { v: .14, to: 70 }); },
    smash() { noise(.5, { v: .6, f: 1400 }); noise(.3, { v: .3, f: 400, at: .05 }); tone(110, .35, { v: .22, to: 40 }); },
    magic() { [784, 988, 1175, 1568, 1976].forEach((f, i) => tone(f, .14, { type: 'sine', v: .12, at: i * .06 })); },
    whoosh() { noise(.45, { v: .22, f: 800, type: 'bandpass', q: 2 }); },
    pant() { [0, .35, .7].forEach(t => noise(.2, { v: .22, f: 700, type: 'bandpass', q: 1, at: t })); },
    rain() { noise(1.4, { v: .18, f: 3000, type: 'highpass' }); },
    fire() { noise(.6, { v: .3, f: 500 }); tone(90, .4, { type: 'sawtooth', v: .06, to: 60 }); },
    type() { tone(1300, .03, { v: .05 }); },
    fall() { tone(520, .4, { type: 'triangle', v: .12, to: 150 }); },
    jump() { tone(300, .16, { v: .09, to: 760 }); },
    fanfare() {
      const n = [523, 523, 659, 784, 659, 784, 1047], d = [.12, .12, .12, .25, .12, .12, .7]; let t = 0;
      n.forEach((f, i) => { tone(f, d[i], { v: .11, at: t }); tone(f / 2, d[i], { type: 'triangle', v: .09, at: t }); t += d[i] * .9; });
    }
  };
})();

/* =========================================================
   ВИМОВА (Web Speech API, en-US)
   ========================================================= */
const TTS = { ok: 'speechSynthesis' in window && typeof SpeechSynthesisUtterance !== 'undefined', voices: [] };
(function initTTS() {
  if (!TTS.ok) { document.body.classList.add('no-tts'); return; }
  const load = () => { TTS.voices = speechSynthesis.getVoices() || []; };
  load();
  speechSynthesis.addEventListener && speechSynthesis.addEventListener('voiceschanged', () => { load(); if (TTS.voices.length) document.body.classList.remove('no-tts'); });
  setTimeout(() => { load(); if (!TTS.voices.length) document.body.classList.add('no-tts'); }, 2500);
})();
function speak(word) {
  if (!TTS.ok) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(word); u.lang = 'en-US'; u.rate = .8;
  const v = TTS.voices.find(v => v.lang === 'en-US') || TTS.voices.find(v => /^en/i.test(v.lang));
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}
const sayBtn = w => `<button class="say" type="button" data-say="${w}" title="Послухати">🔊</button>`;
document.addEventListener('click', e => { const b = e.target.closest('[data-say]'); if (b) { e.stopPropagation(); e.preventDefault(); speak(b.dataset.say); } }, true);

/* =========================================================
   ПІКСЕЛЬНІ СПРАЙТИ І ТЕКСТУРИ (власний дизайн)
   ========================================================= */
const MINER = [
  "....YYYY....",
  "..YYYYYYYY..",
  ".YYYYLLYYYY.",
  ".kkkkkkkkkk.",
  "..HSSSSSSH..",
  "..SEESSEES..",
  "..SSSSSSSS..",
  "..SSSRRSSS..",
  "...SSSSSS...",
  "..OObbbbOO..",
  ".OOObbbbOOO.",
  ".SOObGGbOOS.",
  "..OObbbbOO..",
  "...bbbbbb...",
  "...bb..bb...",
  "...bb..bb...",
  "..DDD..DDD.."
];
const MPAL = { Y: '#ffcc1a', L: '#fffbe0', k: '#c98b00', H: '#5a3820', S: '#f2c08f', E: '#1b1b2a', R: '#b4505a', O: '#ff8a2a', b: '#2f6fd6', G: '#ffd84a', D: '#4a2c17' };
const DIAMOND = [
  "..WWCCCC..",
  ".WCWCCCCB.",
  "WCCCCCCCBB",
  "DDDDDDDDDD",
  ".CCCCCCCB.",
  "..CCCCCB..",
  "...CCCB...",
  "....CB...."
];
const DPAL = { W: '#ffffff', C: '#4ff0ff', B: '#1a9fc0', D: '#a8fbff' };
function spriteCanvas(rows, pal, s) {
  const c = cnv(rows[0].length * s, rows.length * s), x = c.getContext('2d');
  rows.forEach((row, y) => [...row].forEach((ch, i) => { if (pal[ch]) { x.fillStyle = pal[ch]; x.fillRect(i * s, y * s, s, s); } }));
  return c;
}
const MINER_CANVAS = spriteCanvas(MINER, MPAL, 5);
const MINER_URL = MINER_CANVAS.toDataURL();
const DIAMOND_URL = spriteCanvas(DIAMOND, DPAL, 16).toDataURL();

const FLOWER_ROWS = ["..P.P..", ".PPPPP.", "PPPCPPP", ".PPPPP.", "..P.P..", "...G...", ".LLG...", "...GLL.", "...G..."];
const flowerCache = {};
function flowerSVG(kind) {
  if (flowerCache[kind]) return flowerCache[kind];
  const pal = kind === 'w' ? { P: '#ff4fa3', C: '#fff36b' } : { P: '#ffb000', C: '#8a3b00' };
  pal.G = '#2f8f2f'; pal.L = '#4cc94c';
  let r = '';
  FLOWER_ROWS.forEach((row, y) => [...row].forEach((ch, x) => { if (pal[ch]) r += `<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="${pal[ch]}"/>`; }));
  return flowerCache[kind] = `<svg viewBox="0 0 7 9" preserveAspectRatio="none" shape-rendering="crispEdges">${r}</svg>`;
}
const flw = (kind, n) => `<span class="fls">${`<i class="fl">${flowerSVG(kind)}</i>`.repeat(n)}</span>`;

const LAYERS = [
  { name: 'Земля', low: 'земля', cols: ['#8b5a2b', '#7a4b22', '#9c6a35', '#6b3f1c'] },
  { name: 'Гравій', low: 'гравій', cols: ['#8f8a85', '#7a7570', '#a39e98', '#66615c'], pebbles: true },
  { name: 'Камінь', low: 'камінь', cols: ['#8a8a8a', '#7c7c7c', '#969696', '#6e6e6e'] },
  { name: 'Темний камінь', low: 'темний камінь', cols: ['#4d4756', '#433e4b', '#57505f', '#3a3541'] },
  { name: 'Глибинний камінь', low: 'глибинний камінь', cols: ['#343a48', '#2c3240', '#3d4453', '#252a36'] },
  { name: 'Діамантова руда', low: 'діамантова руда', cols: ['#3a3f4a', '#30343e', '#454a56', '#2a2e37'], ore: ['#5ff3ff', '#2cc8e0', '#c9ffff'] }
];
function layerTex(L, i, W, LH) {
  const c = cnv(W, LH), x = c.getContext('2d'), R = rng(100 + i * 17), P = 8;
  for (let y = 0; y < LH; y += P) for (let xx = 0; xx < W; xx += P) { x.fillStyle = pickW(L.cols, R); x.fillRect(xx, y, P, P); }
  if (L.pebbles) for (let k = 0; k < 170; k++) {
    const px = Math.floor(R() * W / P) * P, py = Math.floor(R() * LH / P) * P;
    x.fillStyle = R() < .5 ? '#b8b3ad' : '#524d49'; x.fillRect(px, py, P * 2, P); x.fillRect(px, py + P, P, P);
  }
  if (L.ore) for (let k = 0; k < 30; k++) {
    const cx = Math.floor(R() * W / P) * P, cy = Math.floor(R() * (LH - 3 * P) / P) * P + P;
    [[0, 0], [1, 0], [0, 1], [1, 1], [2, 1], [1, 2]].forEach(([a, b]) => { if (R() < .8) { x.fillStyle = L.ore[Math.floor(R() * L.ore.length)]; x.fillRect(cx + a * P, cy + b * P, P, P); } });
  }
  x.fillStyle = 'rgba(0,0,0,.22)';
  const B = 64;
  for (let row = 0; row * B < LH; row++) { const off = (row % 2) * 32; x.fillRect(0, row * B, W, 3); for (let bx = -off; bx < W; bx += B) x.fillRect(bx, row * B, 3, B); }
  x.fillStyle = 'rgba(255,255,255,.12)'; x.fillRect(0, 0, W, 4);
  x.fillStyle = 'rgba(0,0,0,.45)'; x.fillRect(0, LH - 3, W, 3);
  if (i === 0) for (let xx = 0; xx < W; xx += P) {
    const d = 2 + Math.floor(R() * 2);
    for (let k = 0; k < d; k++) { x.fillStyle = k === 0 ? '#6fd34a' : (R() < .5 ? '#4fae32' : '#3f9a28'); x.fillRect(xx, k * P, P, P); }
  }
  return c;
}
function grassTex() {
  const c = cnv(48, 48), x = c.getContext('2d'), R = rng(5), P = 6;
  for (let y = 0; y < 48; y += P) for (let xx = 0; xx < 48; xx += P) {
    let col;
    if (y < 12) col = ['#5cc93a', '#4fb531', '#6bd84a'][R() * 3 | 0];
    else if (y < 18) col = R() < .5 ? '#4fb531' : '#8b5a2b';
    else col = ['#8b5a2b', '#7a4b22', '#9c6a35'][R() * 3 | 0];
    x.fillStyle = col; x.fillRect(xx, y, P, P);
  }
  return c.toDataURL();
}
function oreTex(col, seed) {
  const c = cnv(60, 60), x = c.getContext('2d'), R = rng(seed), P = 6;

  }

    if (now < confUntil) for (let k = 0; k < 5; k++) P.push({ x: Math.random() * 1920, y: -20, vx: (Math.random() - .5) * 3, vy: 2 + Math.random() * 3, s: 12 + Math.random() * 12, c: COLS[Math.random() * COLS.length | 0], life: 500, g: .04, rot: Math.random() * 6, vr: (Math.random() - .5) * .3, conf: true });

      wk.className = 'walker'; wk.style.transition = 'none'; wk.style.left = (X0 - 30) + 'px'; bub.classList.add('hidden');

      wk.style.left = (X0 + slot * (i + 1) - 30) + 'px';

        count++; num.textContent = count; bump(cnt); Sound.pop(count);

  sleep(ms) { const g = this.gen; return new Promise((res, rej) => setTimeout(() => g === this.gen ? res() : rej(CANCEL), ms)); },
  cancel() { this.gen++; },

  },

  { t: `Чари мають спрацювати, коли гравець напише в чат <b class="en">"fire"</b>`, ans: 'chat', word: 'fire', fx: 'fire', act: '🔥 вогонь',

  { t: `<b>Один раз</b> на початку гри привітати гравця`, ans: 'start', word: 'hello', fx: 'greet', act: '👋 привітання',
    ok: `Так! Привітання з'явилося один раз на початку гри — це on start.`,

];
const R5 = new Round({
  layer: 4, level: 2, parts: 4, title: 'Коли спрацює магія?',
  ask() { return `${SITS[this.idx].t}.<br><small>Коли має спрацювати магія — при запуску чи після команди в чаті?</small>`; },
  answer() {
    const s = SITS[this.idx];
    return { html: `${s.t}<br>→ <span class="en">${s.ans === 'chat' ? 'on chat command' : 'on start'}</span> (${s.ans === 'chat' ? 'команда чату' : 'при запуску'})` };
  },
  fast: { q: `Придумайте свою команду для чату! Що вона робитиме?`, a: `Наприклад: гравець пише <span class="en">"tree"</span> — і виростає дерево 🌳.<br>Це <span class="en">chat command</span> — команда чату!` },
  build() {
    const r = this; r.busy = false; r.idx = 0; r.solved = [false, false, false, false];
    r.el.innerHTML = r.header() + `
      <div class="sit"><div class="sit-n">Ситуація <span class="sn">1</span> з 4 <span class="dots">${'<i></i>'.repeat(4)}</span></div><div class="sit-t"></div></div>
      <div class="choices">
        <div class="ch"><button class="choice" data-c="start"></button><div class="ua">${sayBtn('on start')} <span class="en">on start</span> = при запуску</div></div>
        <div class="ch"><button class="choice" data-c="chat"></button><div class="ua">${sayBtn('chat command')} <span class="en">chat command</span> = команда чату</div></div>
      </div>
      <div class="world"><div class="wsky"></div><div class="wground"></div><img class="wminer" alt="" src="${MINER_URL}"><div class="wfx"></div><div class="wstatus"></div><div class="wchat">💬 <span class="ctext"></span><span class="caret">▌</span></div></div>` + r.msgbar('');
    $$('.choice', r.el).forEach(b => b.onclick = () => r.choose(b.dataset.c));
    r.renderSit();
  },
  renderSit() {
    const r = this, s = SITS[r.idx];
    $('.sn', r.el).textContent = r.idx + 1;
    $$('.dots i', r.el).forEach((d, k) => { d.className = (r.solved[k] ? 'ok ' : '') + (k === r.idx ? 'cur' : ''); });
    const t = $('.sit-t', r.el); t.innerHTML = s.t; t.style.animation = 'none'; void t.offsetWidth; t.style.animation = '';
    const [bs, bc] = $$('.choice', r.el);
    bs.innerHTML = hatHTML('on start', s.act);
    bc.innerHTML = hatHTML(`on chat command <span class="mc-str">"${s.word}"</span>`, s.act);
    [bs, bc].forEach(b => { b.disabled = r.solved[r.idx]; b.classList.remove('chosen'); });
    $('.world', r.el).classList.remove('on'); $('.wfx', r.el).innerHTML = ''; $('.ctext', r.el).textContent = '';
    $('.wstatus', r.el).textContent = 'Що станеться? Оберіть блок — і подивимось!';
    r.msg('Яка подія потрібна: <span class="en">on start</span> чи <span class="en">on chat command</span>?');
  },
  status(t) { $('.wstatus', this.el).textContent = t; },
  stopFx() { $('.wfx', this.el).innerHTML = ''; },
  effect(fx) {
    const L = $('.wfx', this.el);
    if (fx === 'fire') {
      L.innerHTML = [0, 1, 2, 3, 4].map(k => `<span class="e-fire" style="left:${520 + k * 80}px;animation-delay:0s,${k * .08}s">🔥</span>`).join('');
      Sound.fire(); FX.burstAt(L, 30, ['#ff7a00', '#ffd23f', '#ff3b00']);
    } else if (fx === 'magic') {
      L.innerHTML = `<div class="e-ring"></div>` + Array.from({ length: 12 }, (_, k) => `<span class="e-spark" style="left:${90 + Math.random() * 520}px;top:${20 + Math.random() * 140}px;animation-delay:${k * .07}s">✨</span>`).join('');
      Sound.magic(); FX.burstAt(L, 30, ['#c07bff', '#ffffff', '#ffd23f']);
    } else if (fx === 'rain') {
      L.innerHTML = `<span class="e-cloud" style="left:300px">☁️</span><span class="e-cloud" style="left:600px">☁️</span><span class="e-cloud" style="left:900px">☁️</span>` +
        Array.from({ length: 70 }, () => `<i class="e-drop" style="left:${250 + Math.random() * 820}px;animation-delay:${-Math.random() * .6}s"></i>`).join('');
      Sound.rain();
    } else if (fx === 'greet') {
      L.innerHTML = `<div class="e-greet">👋 Вітаємо у світі, гравцю!</div>`;
      Sound.good(); FX.burstAt(L, 30);
    }
  },
  async typeChat(word) {
    const c = $('.ctext', this.el), box = $('.wchat', this.el);
    c.textContent = ''; box.classList.remove('sent');
    for (const ch of word) { c.textContent += ch; Sound.type(); await this.sleep(160); }
    await this.sleep(250); box.classList.add('sent'); Sound.click(); await this.sleep(300); box.classList.remove('sent');
  },
  async play(s, c) {
    const r = this, sl = ms => r.sleep(ms), W = $('.world', r.el);
    W.classList.remove('on'); r.stopFx(); $('.ctext', r.el).textContent = ''; r.status('Світ вимкнено…');
    await sl(450);
    r.status('▶ Світ запускається…'); Sound.whoosh(); W.classList.add('on'); await sl(1000);
    if (c === 'start') {
      r.status('⚡ on start — спрацювало при запуску!'); r.effect(s.fx); await sl(1700);
      if (s.ans === 'chat') {
        if (s.fx === 'rain') {
          r.stopFx(); r.status('Дощ закінчився. Гравець пише в чат…'); await sl(700);
          await r.typeChat(s.word);
          $('.wfx', r.el).innerHTML = '<div class="e-none">🤷</div>';
          r.status('💬 Гравець написав «rain»… а дощу немає!'); Sound.soft(); await sl(1600);
        } else { r.status('🤔 А гравець ще нічого не писав у чат!'); await sl(1400); }
      }
    } else {
      r.status(`⏳ Блок чекає, поки гравець напише «${s.word}»…`); await sl(1400);
      if (s.ans === 'chat') {
        await r.typeChat(s.word);
        r.status(`💬 Гравець написав «${s.word}» — чари спрацювали!`); r.effect(s.fx); await sl(1700);
        if (s.fx === 'rain') {
          r.stopFx(); r.status('Дощ закінчився. А якщо ще раз?'); await sl(800);
          await r.typeChat('rain'); r.effect('rain'); r.status('💬 Знову «rain» — і знову дощ! 🌧'); await sl(1700);
        }
      } else {
        $('.wfx', r.el).innerHTML = '<div class="e-none">😶</div>';
        r.status('…але гравець нічого не пише. Нічого не сталося!'); await sl(1500);
      }
    }
    return c === s.ans;
  },
  async choose(c) {
    const r = this; if (r.busy || r.solved[r.idx]) return;
    r.busy = true; const btns = $$('.choice', r.el);
    btns.forEach(b => { b.disabled = true; b.classList.toggle('chosen', b.dataset.c === c); });
    Sound.click(); r.msg('Дивимось, що станеться… 👀');
    let solved = false;
    try {
      const s = SITS[r.idx], ok = await r.play(s, c);
      if (ok) {
        solved = true; r.solved[r.idx] = true; Sound.good();
        r.msg('✅ ' + s.ok, 'ok');
        $$('.dots i', r.el)[r.idx].classList.add('ok');
        r.part('s' + r.idx);
        if (r.idx < 3) { const b = h(`<button class="btn gold big pulse-btn">Наступна ситуація →</button>`); b.onclick = () => { r.idx++; r.setAct(null); r.renderSit(); }; r.setAct(b); }
      } else { Sound.soft(); r.msg(s.bad + ' Спробуйте ще раз!', 'bad'); }
    } catch (e) { swallow(e); }
    finally { r.busy = false; btns.forEach(b => { b.disabled = solved || r.solved[r.idx]; if (!solved) b.classList.remove('chosen'); }); }
  }
});

const ROUNDS = [R1, R2, R3, R4, R5, R6];
const SCREENS = [INTRO, R1, R2, R3, TRANS, R4, R5, R6, FINAL];
let cur = 0;
const isRound = s => s instanceof Round;

(function buildSquares() {
  $('#tbSquares').innerHTML = LAYERS.map((L, i) => `<div class="sq" style="background-image:url(${SWATCH[i]})" title="${L.name}"></div>`).join('');

function updateTop() {
  const s = SCREENS[cur];
  $('#tbLevel').textContent =
    s === INTRO ? '📖 Книга заклинань' :
    s === TRANS ? '🏃 Перерва-пробіжка' :
    s === FINAL ? '🏆 Фінал' :
    s.level === 1 ? 'Рівень 1 · Математика «Квітковий слід»' : 'Рівень 2 · Англійська «Слова-заклинання»';
  const allBroken = ROUNDS.every(r => Mine.isBroken(r.layer));
  $('#tbProg').textContent = isRound(s) ? `Шар ${s.layer + 1} з 6` : s === FINAL && allBroken ? 'Усі 6 шарів! 💎' : `Шар ${Math.min(Mine.current() + 1, 6)} з 6`;
  $$('.sq').forEach((q, i) => { q.classList.toggle('broken', Mine.isBroken(i)); q.classList.toggle('cur', isRound(s) ? s.layer === i : Mine.current() === i); });
}
function nextLocked() { const s = SCREENS[cur]; return isRound(s) && !Mine.isBroken(s.layer); }
function updateNav() {
  const s = SCREENS[cur], r = isRound(s);
  ['#bAsk', '#bAns', '#bFast', '#bReset'].forEach(id => $(id).classList.toggle('hidden', !r));
  $('#bPrev').disabled = cur === 0;
  const nb = $('#bNext');
  nb.classList.toggle('hidden', cur === SCREENS.length - 1);
  nb.classList.toggle('locked', nextLocked());
  nb.title = nextLocked() ? 'Спочатку розбийте шар ⛏' : 'Клавіша →';
  nb.classList.toggle('pulse-btn', r && !nextLocked());
}
let trTimer = null;
function transStart() {
  const run = $('.tr-runner'), fl = $('.tr-flowers');
  clearInterval(trTimer);
  trTimer = setInterval(() => {
    const x = run.offsetLeft + 30; if (x < 0 || x > 1880) return;
    const kind = Math.random() < .5 ? 'w' : 'r';
    const f = h(`<div class="flower" style="left:${x}px;width:40px;height:52px">${flowerSVG(kind)}</div>`);
    fl.appendChild(f); setTimeout(() => f.remove(), 2600);
  }, 230);
}
function transStop() { clearInterval(trTimer); $('.tr-flowers').innerHTML = ''; }

function go(i) {
  i = Math.max(0, Math.min(SCREENS.length - 1, i));
  const prev = SCREENS[cur]; if (isRound(prev)) prev.cancel();
  Modal.hide();
  cur = i; const s = SCREENS[i];
  SCREENS.forEach(x => x.el && x.el.classList.toggle('active', x === s));
  $('#trans').classList.toggle('active', s === TRANS);
  if (s === TRANS) transStart(); else transStop();
  if (s === FINAL) { FX.confetti(7000); Sound.fanfare(); }
  if (isRound(prev) && prev !== s) {
    // анімацію зупинено — повертаємо раунд у робочий стан
    prev.busy = false; $$('button', prev.el).forEach(b => { if (!b.closest('.opt') && !b.classList.contains('choice') && !b.closest('.act')) b.disabled = false; });
    if (prev === R5) prev.renderSit();
  }
  updateTop(); updateNav();
}
function next() {
  if (nextLocked()) { toast('Спочатку розбийте шар ⛏'); Sound.soft(); return; }
  if (cur < SCREENS.length - 1) { Sound.click(); go(cur + 1); }
}
function prev() { if (cur > 0) { Sound.click(); go(cur - 1); } }
function resetRound() { const s = SCREENS[cur]; if (!isRound(s)) return; s.reset(); Sound.whoosh(); toast('↺ Раунд скинуто'); updateNav(); }
function restartAll() { Mine.resetAll(); ROUNDS.forEach(r => r.reset()); FX.clear(); go(0); }

   КНОПКИ І КЛАВІАТУРА
   ========================================================= */
$('#bAsk').onclick = () => { const s = SCREENS[cur]; if (!isRound(s)) return; Sound.click(); Modal.show({ kick: '🤔 Як думаєте?', text: s.ask() }); };
$('#bAns').onclick = () => { const s = SCREENS[cur]; if (!isRound(s)) return; Sound.click(); const a = s.answer(); Modal.show({ kick: '👀 Відповідь', text: a.html, cls: 'ans' + (a.small ? ' small' : '') }); };
$('#bFast').onclick = () => { const s = SCREENS[cur]; if (!isRound(s)) return; Sound.click(); Modal.show({ kick: '⚡ Для швидких', text: s.fast.q, ans: s.fast.a }); };
$('#bReset').onclick = resetRound;
$('#bPrev').onclick = prev;
$('#bNext').onclick = next;
$('#tPrev').onclick = prev;
$('#tNext').onclick = next;
$('#bStart').onclick = next;
$('#bAgain').onclick = restartAll;
$('#bSound').onclick = () => { const m = Sound.toggle(); $('#bSound').textContent = m ? '🔇' : '🔊'; };
$('#bFull').onclick = () => { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().catch(() => {}); };
addEventListener('keydown', e => {
  if (e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
  if (Modal.open) { if (e.key === 'Escape' || e.key === 'Enter') { e.preventDefault(); Modal.hide(); } return; }
  if (e.key === 'ArrowRight') { e.preventDefault(); next(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); }
  else if (e.code === 'KeyR') { e.preventDefault(); resetRound(); }
});

/* ---------- старт ---------- */
ROUNDS.forEach(r => r.build());
go(0);
</script>
</body>
